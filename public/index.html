<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ИГРОТЕКА — каталог настольных игр: поиск, фильтры, избранное и сравнение.">
  <meta name="color-scheme" content="light dark">
  <title>ИГРОТЕКА — каталог настольных игр</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="./">ИГРОТЕКА</a>
      <button id="favorites-button" class="icon-button site-header__favorites" type="button" aria-controls="favorites-drawer" aria-expanded="false" aria-label="Избранное">
        <span aria-hidden="true">♥</span>
        <span id="favorites-count" class="badge" aria-hidden="true" hidden>0</span>
      </button>
    </div>
  </header>

  <dialog id="favorites-drawer" class="drawer"></dialog>
  <dialog id="game-modal" class="modal"></dialog>
  <dialog id="compare-dialog" class="modal modal--wide"></dialog>
  <div id="toasts" class="toast-region" role="status" aria-live="polite"></div>

  <main id="catalog" class="container" aria-labelledby="catalog-title">
    <h1 id="catalog-title" class="catalog__title">Каталог настольных игр</h1>
    <div class="search">
      <label class="visually-hidden" for="search-input">Поиск по названию</label>
      <input id="search-input" class="input search__input" type="search" placeholder="Поиск по названию" autocomplete="off" enterkeyhint="search" maxlength="100">
    </div>
    <div class="catalog-layout">
      <aside id="filters" class="filters" aria-label="Фильтры"></aside>
      <div class="catalog-main">
        <div id="toolbar" class="toolbar"></div>
        <noscript>
          <p class="catalog-message">Для работы каталога нужен JavaScript.</p>
        </noscript>
        <div id="catalog-root" class="catalog"></div>
      </div>
    </div>
  </main>

  <section id="about" class="container" aria-labelledby="about-title">
    <h2 id="about-title">О проекте</h2>
    <p>Раздел «О проекте» появится на этапе 9.</p>
  </section>

  <div id="compare-bar" class="compare-bar" role="region" aria-label="Сравнение" hidden></div>

  <footer class="site-footer">
    <div class="container">
      <p>ИГРОТЕКА</p>
    </div>
  </footer>
</body>
</html>
